function drawOriginalCard() {
  ctx.clearRect(0, 0, 1080, 1920);
  ctx.drawImage(img, 0, 0, 1080, 1920);
}

async function generateCard() {
  const name = document.getElementById("employeeName").value.trim();
  if (!imageReady) { alert("Please wait for the card to load."); return false; }
  if (!name) { alert("Please enter your name."); return false; }

  try {
    await Promise.all([
      document.fonts.load(`${FONT_WEIGHT} 40px "Noto Sans"`, name),
      document.fonts.load(`${FONT_WEIGHT} 40px "Noto Sans Arabic"`, name)
    ]);
  } catch (e) {}

  drawOriginalCard();
  ctx.save();
  let size = MAX_FONT_SIZE;
  ctx.direction = "auto";
  ctx.textAlign = "center";
  ctx.textBaseline = "alphabetic";
  ctx.fillStyle = NAME_COLOR;
  ctx.font = `${FONT_WEIGHT} ${size}px ${FONT_FAMILY}`;
  while (ctx.measureText(name).width > MAX_NAME_WIDTH && size > MIN_FONT_SIZE) {
    size -= 2;
    ctx.font = `${FONT_WEIGHT} ${size}px ${FONT_FAMILY}`;
  }
  // vertical centering using real glyph metrics
  const m = ctx.measureText(name);
  const asc = m.actualBoundingBoxAscent, desc = m.actualBoundingBoxDescent;
  const y = NAME_Y + (asc - desc) / 2;
  ctx.fillText(name, NAME_X, y);
  ctx.restore();

  generated = true;
  const result = document.getElementById("result");
  canvas.toBlob(function (blob) {
    if (!blob) return;
    if (previewURL) URL.revokeObjectURL(previewURL);
    previewURL = URL.createObjectURL(blob);
    result.src = previewURL;
    result.style.display = "block";
    canvas.style.display = "none";
  }, "image/jpeg", 0.95);
  document.getElementById("downloadButton").disabled = false;
  document.getElementById("status").textContent =
    "جاهزة! اضغط Save / Share، أو اضغط مطولاً على الصورة واختر Add to Photos";
  return true;
}

async function downloadCard() {
  const ok = await generateCard();
  if (!ok) return;

  canvas.toBlob(async function (blob) {
    if (!blob) return;
    const file = new File([blob], "UAE-National-Day-Greeting.jpg", { type: "image/jpeg" });

    // iPhone / Android: open the share sheet (Save Image / Add to Photos)
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      try {
        await navigator.share({ files: [file] });
        return;
      } catch (e) {
        if (e && e.name === "AbortError") return;
      }
    }

    // Desktop fallback: normal download
    const url = URL.createObjectURL(blob);
    const link = document.createElement("a");
    link.download = "UAE-National-Day-Greeting.jpg";
    link.href = url;
    document.body.appendChild(link);
    link.click();
    link.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 10000);
  }, "image/jpeg", 0.95);
}
</script>
